[project]
name = "cole-platform"
version = "0.1.0"
description = "Nền tảng đào tạo thực hành theo bài toán doanh nghiệp — backend (api + worker)"
requires-python = ">=3.11"
dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "sqlalchemy>=2",
  "pydantic>=2",
  "pydantic-settings",
  "argon2-cffi",
  "openpyxl",
  "python-multipart",
  "httpx",
  "pyyaml",
  "jsonschema",
  "websockets",
]

[project.optional-dependencies]
dev = ["pytest"]
# runtime/runner (the only process that talks to the container engine) + test_runner_security.py
runner = ["docker>=7"]

[tool.pytest.ini_options]
pythonpath = ["src", "../sdk/python"]
testpaths = ["tests"]
